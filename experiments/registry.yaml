      architecture: Gemma4ForConditionalGeneration (AutoModelForMultimodalLM)
    task:
      name: AstroCLIMB 4-class pair relation classification
      formulation: multiclass single-label
      num_classes: 4
      labels: [same_figure, same_paper, related_papers, unrelated_papers]
      label_mapping: NEW data label int 0=same_paper, 1=related_papers, 2=same_figure, 3=unrelated_papers; submission order [same_figure, same_paper, related_papers, unrelated_papers]
    dataset:
      name: jcxiv42/astroclimb sampled (NEW 23-col)
      url: https://huggingface.co/datasets/adsabs/AstroCLIMB
      source: /kaggle/input/datasets/jcxiv42/astroclimb/astroclimb_4class(sampled).csv + object_images_sampled/{uuid}.png
      version: unknown
      configuration: 1800 balanced (450/label; pair types FIG-CAP/CAP-FIG/FIG-FIG/CAP-CAP 450 each)
      split: validation-style generation eval on all 1800 (no train/test split in-notebook; adapter trained externally)
      train_size: 0
      validation_size: 1800
      test_size: 0
    modality: {image: true, caption: true, text: true, other: none}
    method: {type: qlora_finetuned_generation_eval, trained: true, fine_tuned: true, peft: true, lora: true, qlora: true}
    prompting:
      strategy: zero-shot
      system_prompt_file: experiments/prompts/EXP001_system.txt
      user_prompt: object-driven; image BEFORE text (finetune contract); captions truncated [:2000]; missing figure -> skip row
      template: SYSTEM_PROMPT + per-object blocks + 'Answer with one label'
      few_shot: false
      num_examples: 0
      reasoning: none (direct label; greedy)
      output_format: lowercase label only
      parsing: normalize raw, map to 4 labels; OOM rows fall back to unrelated_papers (0 such rows here)
    preprocessing: {image: thumbnail(448,448), caption: truncate 2000 chars, text: same, labels: map to submission order}
    training:
      note: adapter trained OUTSIDE this notebook (Lightning/HF run); this notebook evaluates it. Finetune-train best val_loss 0.3489 at 900 steps per notebook output.
      epochs: unknown
      steps: 900
      batch_size: unknown
      effective_batch_size: unknown
      learning_rate: unknown
      optimizer: unknown
      precision: bfloat16
      quantization: 4-bit NF4 (bnb_4bit_compute_dtype=bfloat16, double_quant True)
      seed: unknown
    inference: {temperature: 0, top_p: unknown, top_k: unknown, max_new_tokens: 32, do_sample: false, seed: unknown, device_map: auto max_memory {0: 14GB, 1: 14GB}, platform: Kaggle GPU T4 x2}
    evaluation:
      split: NEW 23-col balanced 1800 (full)
      metric: macro-F1 (sklearn classification_report, labels=label_cols)
      macro_f1: 0.6170137014077717
      accuracy: 0.6238888888888889
      per_class_f1: {same_figure: 0.8169014084507042, same_paper: 0.5925925925925926, related_papers: 0.3714670255720054, unrelated_papers: 0.6870937790157846}
