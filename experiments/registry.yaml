      strategy: zero-shot
      system_prompt_file: experiments/prompts/EXP001_system.txt
      user_prompt: object-driven; image BEFORE text (finetune contract); captions truncated [:2000]; missing figure -> skip row
      template: SYSTEM_PROMPT + per-object blocks + 'Answer with one label'
      few_shot: false
      num_examples: 0
      reasoning: none (direct label; greedy)
      output_format: lowercase label only
      parsing: normalize raw, map to 4 labels; OOM rows fall back to unrelated_papers (0 such rows here)
