      note: adapter trained OUTSIDE this notebook; this notebook evaluates it. Finetune-train best val_loss 0.3489 at 900 steps per notebook output. The 900-step session itself is unpreserved; the closest artifact is the v1-era training script notebooks/excluded/EXCLUDED__gemma4_e4b_v1era_train__failed_oom_no_adapter.ipynb (same target repo, same recipe family r64/alpha128/LR 1e-4/eff16/cosine/1536, variant-B prompt, unmasked loss), whose preserved session OOM-died without producing an adapter - recipe details inferred for the 900-step run from that script, NOT directly evidenced.
      epochs: unknown
      steps: 900
      batch_size: unknown
      effective_batch_size: unknown
      learning_rate: unknown
      optimizer: unknown
      precision: bfloat16
      quantization: 4-bit NF4 (bnb_4bit_compute_dtype=bfloat16, double_quant True)
      seed: unknown
    inference: {temperature: unset_in_code (greedy via do_sample=False), top_p: unknown, top_k: unknown, max_new_tokens: 32, do_sample: false, seed: unknown, device_map: auto max_memory {0: 14GB, 1: 14GB}, platform: Kaggle GPU T4 x2}
